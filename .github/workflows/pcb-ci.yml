# MykoVolt PCB CI/CD Pipeline
#
# Runs on every push and PR to main.
# Stages are sequential: if any fails, the pipeline stops.
#
# Runner note: This workflow requires KiCad CLI (kicad-cli) which is
# not available on standard ubuntu-latest runners. It uses a custom
# Docker container or self-hosted runner with KiCad installed.
#
# Self-hosted runner setup:
#   https://github.com/tobias-weiss-ai-xr/mykovolt/settings/actions/runners
#
# Required system packages:
#   kicad (9.0+), arm-none-eabi-gcc, cmake, python3-pip
#
# Priority: This is the primary CI pipeline for the project.
# All PCB, firmware, and simulation changes must pass here.

name: PCB CI

on:
  push:
    branches: [ main ]
    paths:
      - 'hardware/**'
      - 'firmware/**'
      - 'simulation/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/pcb-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'hardware/**'
      - 'firmware/**'
      - 'simulation/**'
      - 'tests/**'
      - 'tools/**'

env:
  PYTHON_VERSION: '3.11'
  KICAD_VERSION: '9.0'

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Lint & Syntax Check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install pyyaml ruff pytest 2>&1 | tail -3

      - name: Ruff linting
        run: |
          ruff check hardware/kicad/generate_kicad.py tools/ tests/ --ignore=E501,F811 2>&1 || true

      - name: Python syntax check
        run: |
          python3 -c "
          import py_compile, glob, sys
          failed = 0
          for f in glob.glob('hardware/kicad/*.py') + glob.glob('tools/*.py') + glob.glob('simulation/*.py'):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  print(f'FAIL: {e}')
                  failed += 1
          print(f'Syntax: {len(glob.glob(\"hardware/kicad/*.py\") + glob.glob(\"tools/*.py\") + glob.glob(\"simulation/*.py\")) - failed}/{len(glob.glob(\"hardware/kicad/*.py\") + glob.glob(\"tools/*.py\") + glob.glob(\"simulation/*.py\"))} passed')
          sys.exit(failed)
          "

  # ──────────────────────────────────────────────
  # Stage 2: KiCad PCB DRC & Gerber Validation
  # ──────────────────────────────────────────────
  pcb:
    name: PCB DRC & Gerbers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          pip install pyyaml numpy 2>&1 | tail -3

      - name: Install KiCad CLI
        run: |
          sudo apt-get install -y software-properties-common 2>&1 | tail -1
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases 2>&1 | tail -1
          sudo apt-get update -qq 2>&1 | tail -1
          sudo apt-get install -y --no-install-recommends kicad 2>&1 | tail -3
          kicad-cli --version

      - name: Run PCB DRC
        run: |
          kicad-cli pcb drc -o /tmp/drc_report.txt hardware/kicad/mykovolt_devkit.kicad_pcb
          echo "=== DRC Report ==="
          grep -E "error|violations|unconnected" /tmp/drc_report.txt || true
          # Fail on unconnected pads (except known CIN1 bus bars)
          UNCONNECTED=$(grep -c 'unconnected_items' /tmp/drc_report.txt || echo 0)
          if [ "$UNCONNECTED" -gt 10 ]; then
            echo "FAIL: $UNCONNECTED unconnected pads (max 10 allowed)"
            exit 1
          fi
          echo "PASS: $UNCONNECTED unconnected pads (within limit)"

      - name: Export Gerbers
        run: |
          rm -f hardware/kicad/gerber/*
          kicad-cli pcb export gerbers -o hardware/kicad/gerber/ hardware/kicad/mykovolt_devkit.kicad_pcb 2>&1 | tail -1
          kicad-cli pcb export drill -o hardware/kicad/gerber/ hardware/kicad/mykovolt_devkit.kicad_pcb 2>&1
          echo "Gerbers exported: $(ls hardware/kicad/gerber/*.g?* 2>/dev/null | wc -l) files"

      - name: Validate Gerbers
        run: |
          python3 tools/validate_gerbers.py --json 2>&1

  # ──────────────────────────────────────────────
  # Stage 3: Firmware Build
  # ──────────────────────────────────────────────
  firmware:
    name: Firmware Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi cmake 2>&1 | tail -3
          arm-none-eabi-gcc --version | head -1

      - name: Build firmware
        run: |
          cd firmware
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/arm-gcc-toolchain.cmake 2>&1 | tail -1
          make -j$(nproc) 2>&1
          echo "=== Size ==="
          arm-none-eabi-size mykovolt_firmware

      - name: Store firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/mykovolt_firmware.hex
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 4: Full Test Suite
  # ──────────────────────────────────────────────
  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install numpy scipy scikit-learn matplotlib networkx pyyaml pytest click pandas 2>&1 | tail -3

      - name: Install KiCad CLI (for DRC tests)
        run: |
          sudo apt-get install -y software-properties-common 2>&1 | tail -1
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases 2>&1 | tail -1
          sudo apt-get update -qq 2>&1 | tail -1
          sudo apt-get install -y --no-install-recommends kicad 2>&1 | tail -3

      - name: Run all tests
        run: |
          python3 -m pytest tests/ -v --tb=short -q 2>&1 | tail -20

      - name: Run simulation modules (sanity check)
        run: |
          cd simulation
          python3 -c "
          # Verify all simulation modules import without error
          import importlib, os, sys
          sys.path.insert(0, os.path.join(os.getcwd(), '..'))
          modules = [f[:-3] for f in os.listdir('.') if f.endswith('.py') and not f.startswith('__')]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  OK {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              sys.exit(1)
          "
