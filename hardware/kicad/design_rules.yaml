# MykoVolt DevKit — Design Rules & Board Configuration
# This file is the single source of truth for PCB generation.
# Loaded by generate_kicad.py --design-rules design_rules.yaml

board:
  name: "MykoVolt DevKit"
  revision: "0.1"
  width_mm: 30.0
  height_mm: 20.0
  thickness_mm: 0.8
  layers: 4
  copper_oz: 1
  finish: "ENIG"
  stackup:
    - { layer: "F.Cu",  type: "signal", thickness_um: 35 }
    - { layer: "In1.Cu", type: "gnd",    thickness_um: 35 }
    - { layer: "In2.Cu", type: "power",  thickness_um: 35 }
    - { layer: "B.Cu",   type: "signal", thickness_um: 35 }

clearance:
  copper_copper_mm: 0.3
  copper_edge_mm: 0.5
  solder_mask_mm: 0.1
  hole_hole_mm: 0.25
  silk_silk_mm: 0.0
  silk_copper_mm: 0.0
  courtyard_overlap: false  # allow courtyard overlap on dense board

routing:
  default_trace_width_mm: 0.3
  default_via_diameter_mm: 0.6
  default_via_drill_mm: 0.3
  power_trace_width_mm: 0.5
  antenna_trace_width_mm: 0.3
  antenna_trace_spacing_mm: 0.3
  i2c_trace_max_length_mm: 50
  usb_trace_impedance_ohm: 90  # not used yet, D+/D- differential

placement:
  edge_margin_mm: 0.5
  component_spacing_mm: 0.5

nfc_antenna:
  center_x_mm: 23.0
  center_y_mm: 10.0
  turns: 4
  outer_width_mm: 12.0
  outer_height_mm: 10.0

sensor_electrodes:
  finger_width_mm: 0.3
  finger_gap_mm: 0.3
  finger_length_mm: 3.0
  num_fingers: 10

i2c:
  speed_hz: 100000
  pullup_resistor_ohm: 2200

power:
  v_cold_start_mv: 300
  v_out_mv: 3300
  mppt_ratio: 0.8

fabrication:
  # JLCPCB constraints
  min_trace_width_mm: 0.3
  min_trace_spacing_mm: 0.3
  min_via_diameter_mm: 0.45
  min_via_drill_mm: 0.2
  min_hole_size_mm: 0.25
  min_silk_width_mm: 0.15
  layer_count: 4
  supported_finishes: ["ENIG", "HASL"]
  panel_width_mm: 100
  panel_height_mm: 100
